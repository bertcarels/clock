# Save this file as: .github/workflows/deploy.yml   (in the "clock" repo)
#
# Before first use:
#   1. In the repo: Settings > Pages > Build and deployment > Source > "GitHub Actions"
#   2. Replace REPO_NAME below with this repo's actual name (the part after the slash
#      in github.com/<user>/REPO_NAME). This becomes the base-href, e.g.
#      https://<user>.github.io/REPO_NAME/
#   3. Adjust the "mv" line below if your dist output folder name differs from "clock".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Angular)
        # --base-href must match the repo name for a project (non-custom-domain) Pages site
        run: npx ng build --base-href=/clock/

      - name: Prepare public folder
        run: |
          mkdir -p public
          mv dist/clock/* public/
          ls -latR public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
