# Save this file as: .github/workflows/deploy.yml   (in the "clock" repo)
#
# Before first use:
#   1. In the repo: Settings > Pages > Build and deployment > Source > "GitHub Actions"
#   2. Base href is "/" because Pages is served from the custom domain
#      clock.kaboutersoft.be (root), not from https://<user>.github.io/clock/.
#      If the custom domain is ever removed, switch back to --base-href=/clock/.
#   3. Adjust the "mv" line below if your dist output folder name differs from "clock".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Angular)
        run: npx ng build --base-href=/

      - name: Prepare public folder
        run: |
          mkdir -p public
          mv dist/clock/* public/
          echo "clock.kaboutersoft.be" > public/CNAME
          ls -latR public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
